name: Mise à jour de Vigie

on:
  schedule:
    - cron: '7 * * * *' # Secours : GitHub ne déclenche pas ces passages de façon fiable, le relais fait le rythme
  workflow_dispatch:
    inputs:
      attendre:
        description: Attendre l'intervalle avant la mise à jour
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Le délai vient de l'environnement « intervalle » (12 min), réglé sur le dépôt : il n'est pas facturé.
  attente:
    if: ${{ inputs.attendre }}
    runs-on: ubuntu-latest
    environment: intervalle
    permissions: {}
    steps:
      - run: 'true'

  update:
    needs: attente
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: vigie
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      # Garde les articles entre deux passages, sans commit à chaque mise à jour.
      - uses: actions/cache@v4
        with:
          path: data
          key: vigie-${{ github.run_id }}
          restore-keys: vigie-
      - run: node news.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub coupe les tâches planifiées après 60 jours sans activité.
      - name: Garder la planification active
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Maintien de la planification'
            git push
          fi

  # Chaque passage lance le suivant, sauf si un passage attend déjà. Pour tout arrêter : désactiver ce workflow.
  relais:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: vigie-relais
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          en_attente=$(gh run list -w vigie.yml -L 20 --json status -q '[.[] | select(.status | test("queued|waiting|pending|requested"))] | length' || echo 0)
          if [ "$en_attente" -gt 0 ]; then exit 0; fi
          for essai in 1 2 3; do
            gh workflow run vigie.yml --ref main -f attendre=true && exit 0
            sleep 60
          done
          exit 1
