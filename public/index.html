<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vigie</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2' opacity='.45'/%3E%3Cpath d='M16 16 23 8a11 11 0 0 1 3 8z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wall" class="wall" aria-hidden="true"></div>
  <aside id="side" class="side glass">
    <a class="brand" href="#today" aria-label="Vigie, aller à Aujourd'hui">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><circle cx="16" cy="16" r="9" fill="none" stroke="var(--bg)" stroke-width="2" opacity=".45"/><path d="M16 16 23 8a11 11 0 0 1 3 8z" fill="var(--bg)"/></svg>
      <span>Vigie</span>
    </a>
    <label class="search">
      <span class="sr">Rechercher dans les actualités</span>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher" autocomplete="off" spellcheck="false">
    </label>
    <nav id="nav" class="nav" aria-label="Catégories"></nav>
    <button id="status" class="status" type="button" aria-haspopup="dialog"></button>
  </aside>
  <main id="main" class="main"></main>
  <button id="fresh" class="fresh glass" type="button" hidden></button>
  <dialog id="sheet" class="sheet"></dialog>
  <script src="app.js"></script>
</body>
</html>
